[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Drowsy"
dynamic = ["version"]
description = "GraphQL type features in a REST API"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Nick Repole", email = "n.repole@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sqlalchemy>=2.0",
    "mqlalchemy>=1.0",
    "marshmallow>=4.0",
    "marshmallow-sqlalchemy>=1.4",
    "inflection",
]

[project.optional-dependencies]
test = [
    "coverage[toml]",
    "pytest",
    "pytest-cov",
    "psycopg2",
    "pyodbc",
]
docs = [
    "sphinx>=8.1",
    "sphinx-autodoc-typehints>=3.0",
    "flask>=3.1",
    "werkzeug>=3.1",
    "swagger-ui-py>=25.7",
    "apispec>=6.8",
]
dev = [
    # Include both test and docs dependencies
    "drowsy[test,docs]",
]

[project.urls]
"Homepage" = "https://github.com/repole/drowsy"
"Bug Reports" = "https://github.com/repole/drowsy/issues"
"Source" = "https://github.com/repole/drowsy"
"Documentation" = "https://drowsy.readthedocs.io/"
"Changelog" = "https://github.com/repole/drowsy/blob/master/CHANGELOG.rst"

[tool.setuptools.dynamic]
version = {attr = "drowsy.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["drowsy*"]

[tool.coverage.run]
source = ["drowsy"]
omit = [
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
